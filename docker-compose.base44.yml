services:
  web:
    image: nginx:alpine
    restart: on-failure
    labels:
      base44.project: "ASTROALQUIMIA"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      # Serve the cloned source directly so edits are visible on refresh.
      - ./:/usr/share/nginx/html:ro
      # Full main config (workers must run as root to read the 0700 mount).
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/index.html | grep -q ASTROALQUIMIA
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
