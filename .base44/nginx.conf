# Full nginx main config for the sandbox preview.
# It runs workers as root because the bind-mounted source directory is not
# world-readable in the sandbox; the mount itself is read-only.
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Never cache during development so edits show on refresh.
    add_header Cache-Control "no-store" always;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Keep repository metadata (.git, etc.) private.
        location ~ /\. {
            deny all;
        }
    }
}
